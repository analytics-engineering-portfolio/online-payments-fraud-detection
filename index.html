<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Payment Fraud Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }

        .fraud {
            background: #ffe5e5;
            border: 2px solid #dc3545;
            color: #dc3545;
        }

        .safe {
            background: #e5f7e9;
            border: 2px solid #28a745;
            color: #28a745;
        }

        .error {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Online Payment Fraud Detection</h1>

        <p class="subtitle">
            Machine Learning based fraud detection using Random Forest
        </p>

        <div class="form-grid">

            <div class="form-group">
                <label>Transaction Type</label>

                <select id="transaction_type">
                    <option value="PAYMENT">PAYMENT</option>
                    <option value="TRANSFER">TRANSFER</option>
                    <option value="CASH_OUT">CASH_OUT</option>
                    <option value="DEBIT">DEBIT</option>
                </select>
            </div>

            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="amount" value="1000">
            </div>

            <div class="form-group">
                <label>Old Balance Origin</label>
                <input type="number" id="oldbalanceOrg" value="50000">
            </div>

            <div class="form-group">
                <label>New Balance Origin</label>
                <input type="number" id="newbalanceOrig" value="49000">
            </div>

            <div class="form-group">
                <label>Old Balance Destination</label>
                <input type="number" id="oldbalanceDest" value="0">
            </div>

            <div class="form-group">
                <label>New Balance Destination</label>
                <input type="number" id="newbalanceDest" value="0">
            </div>

            <div class="form-group">
                <label>Step</label>
                <input type="number" id="step" value="1">
            </div>

            <div class="form-group">
                <label>Flagged Fraud</label>

                <select id="isFlaggedFraud">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

        </div>

        <button onclick="predictFraud()">
            Predict Fraud
        </button>

        <div id="result"></div>

        <div class="footer">
            Online Payments Fraud Detection | Random Forest ML Model
        </div>

    </div>


    <script>

        async function predictFraud() {

            const resultBox = document.getElementById("result");

            resultBox.style.display = "block";
            resultBox.className = "";
            resultBox.innerHTML = "Analyzing transaction...";


            const data = {

                step: Number(
                    document.getElementById("step").value
                ),

                transaction_type:
                    document.getElementById("transaction_type").value,

                amount:
                    Number(
                        document.getElementById("amount").value
                    ),

                oldbalanceOrg:
                    Number(
                        document.getElementById("oldbalanceOrg").value
                    ),

                newbalanceOrig:
                    Number(
                        document.getElementById("newbalanceOrig").value
                    ),

                oldbalanceDest:
                    Number(
                        document.getElementById("oldbalanceDest").value
                    ),

                newbalanceDest:
                    Number(
                        document.getElementById("newbalanceDest").value
                    ),

                isFlaggedFraud:
                    Number(
                        document.getElementById("isFlaggedFraud").value
                    )
            };


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );


                if (!response.ok) {
                    throw new Error("API request failed");
                }


                const result = await response.json();


                const probability =
                    (result.fraud_probability * 100).toFixed(2);


                if (result.prediction === 1) {

                    resultBox.className = "fraud";

                    resultBox.innerHTML =
                        "⚠️ FRAUD DETECTED" +
                        "<br><br>" +
                        "Fraud Probability: " +
                        probability + "%";

                } else {

                    resultBox.className = "safe";

                    resultBox.innerHTML =
                        "✅ TRANSACTION IS SAFE" +
                        "<br><br>" +
                        "Fraud Probability: " +
                        probability + "%";
                }


            } catch (error) {

                resultBox.className = "error";

                resultBox.innerHTML =
                    "❌ Error connecting to API";

                console.error(error);
            }
        }

    </script>

</body>

</html>
